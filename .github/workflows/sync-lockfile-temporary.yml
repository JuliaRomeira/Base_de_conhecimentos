name: Sincronizar lockfile (temporário)

on:
  push:
    branches:
      - maintenance/sync-lockfile-20261028
    paths:
      - .github/workflows/sync-lockfile-temporary.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de manutenção
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar lockfile sem executar scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirmar consistência da instalação
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit apenas do lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile já estava sincronizado"
          else
            git commit -m "chore: sincronizar package-lock.json com package.json"
            git push origin HEAD:maintenance/sync-lockfile-20261028
          fi
