name: Testes e build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Testes e compilação
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências com versões fixadas
        run: npm ci --no-audit --no-fund
      - name: Testar navegação pelo conteúdo e busca
        run: npm test
      - name: Build de produção
        run: npm run build
